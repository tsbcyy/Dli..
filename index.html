<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>生日快乐</title>
    <link rel="stylesheet" href="css/skystar.css">
  </head>
  <body>
    <!-- 0. 预加载遮罩层 -->
    <div id="loading-overlay">
      <div class="loader-circle"></div>
      <div class="loading-text">🌙 正在生成专属祝福页面...</div>
      <div class="loading-sub">为你打造星光璀璨的一刻</div>
    </div>

    <!-- 1. 初始静态背景图片 -->
    <div id="static-bg"></div>

    <!-- 2. 隐藏的视频背景（预加载使用） -->
    <video id="videofilm" poster="img/skystar2.jpg" style="display:none;" muted playsinline webkit-playsinline preload="auto">
      <source src="video/skystar.mp4" type="video/mp4">
    </video>

    <!-- 3. 粒子特效层 -->
    <canvas id="particles-canvas"></canvas>
    
    <!-- 4. 主标题粒子文字层 -->
    <canvas id="text-canvas"></canvas>

    <!-- 5. 背景音乐 -->
    <audio id="bg-music" src="video/晴天.mp3" autoplay loop muted preload="auto"></audio>

    <!-- 6. 悬浮祝福语容器 -->
    <div class="container" style="display:none;"></div>

    <!-- 7. 按钮 -->
    <button id="next-btn" style="display:none;">🌸 换一句</button>

    <script src="js/skystar.js"></script>
  </body>
</html>
