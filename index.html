<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>生日快乐</title>
    <link rel="stylesheet" href="css/skystar.css">
  </head>
  <body>
    <!-- 1. 初始静态背景图片 -->
    <div id="static-bg"></div>

    <!-- 2. 隐藏的视频背景 -->
    <video id="videofilm" poster="img/skystar2.jpg" style="display:none;" muted playsinline webkit-playsinline preload="auto">
      <source src="video/skystar.mp4" type="video/mp4">
    </video>

    <!-- 3. 粒子特效层（漂浮的粉色小点） -->
    <canvas id="particles-canvas"></canvas>

    <!-- 4. 主标题粒子文字层（切换时平滑过渡） -->
    <canvas id="text-canvas"></canvas>

    <!-- 5. 隐藏的背景音乐 -->
    <audio id="bg-music" src="video/晴天.mp3" style="display:none;" loop preload="auto"></audio>

    <!-- 6. 按钮 -->
    <button id="next-btn">🌸按钮</button>

    <script src="js/skystar.js"></script>
  </body>
</html>
